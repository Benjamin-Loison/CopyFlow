name: copyflow
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.12.0


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  intl: ^0.20.3
  uuid: ^4.6.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  hive_ce_generator: ^1.11.2
  flutter_slidable: ^4.0.3
  timeago: ^3.7.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.8.0

  
  flutter_lints: ^6.0.0
  rename_app: ^1.6.6
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/copyflow.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/copyflow.png"

flutter:

  
  uses-material-design: true

  
